name: Claude Code plugin

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'plugins/claude-code/**'
      - 'tests/claude-code/**'
      - 'src/vt_mcp/client_contracts.json'
      - 'scripts/client_docs.py'
      - '.github/workflows/claude-code-plugin.yml'
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'plugins/claude-code/**'
      - 'tests/claude-code/**'
      - 'src/vt_mcp/client_contracts.json'
      - 'scripts/client_docs.py'
      - '.github/workflows/claude-code-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-code-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Test file boundaries, provenance and packaged hook without credentials
        run: node --test tests/claude-code/expand-file.test.mjs tests/claude-code/manifest.test.mjs
      - name: Validate packaged plugin with the native CLI
        run: npm exec --yes --package=@anthropic-ai/claude-code@2.1.283 -- claude plugin validate plugins/claude-code --strict
      - name: Validate marketplace with the native CLI
        run: npm exec --yes --package=@anthropic-ai/claude-code@2.1.283 -- claude plugin validate . --strict
