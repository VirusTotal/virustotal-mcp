name: PyPI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify existing release assets, or explicitly publish them
        type: choice
        options: [verify, publish]
        default: verify
      tag:
        description: Reviewed annotated release tag (v0.8.2 supports verify only)
        type: string
        required: true
      source_sha:
        description: Reviewed full source commit of that release
        type: string
        required: true
      manifest_sha256:
        description: Reviewed SHA256 of its SHA256SUMS release asset
        type: string
        required: true
      release_run_id:
        description: Successful Release run, including Install the published release
        type: string
        required: true

permissions: {}

concurrency:
  group: pypi-vt-mcp
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYPI_MODE: ${{ inputs.mode }}
  RELEASE_TAG: ${{ inputs.tag }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
  RELEASE_RUN_ID: ${{ inputs.release_run_id }}

jobs:
  verify:
    if: github.repository == 'VirusTotal/virustotal-mcp' && github.repository_id == '1361592455' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.assets.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source, completed workflows and exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_pypi.py prepare --directory verified-release
      - name: Retain verified assets and separate provenance
        id: assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-release/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  publish:
    if: inputs.mode == 'publish'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: verified-release
          merge-multiple: true
      - name: Recheck transferred bytes and require PyPI version still absent
        run: python3 scripts/publish_pypi.py check --directory verified-release
      - name: Publish the checked wheel and sdist with Trusted Publishing
        id: upload
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, reviewed 2026-09-08
        with:
          packages-dir: verified-release/packages
          attestations: true
          skip-existing: false
          verbose: false
          print-hash: true
      - name: Read PyPI after the upload attempt; never retry publication
        if: always() && steps.upload.outcome != 'skipped'
        run: python3 scripts/publish_pypi.py reconcile --directory verified-release
      - name: Retain publication checks even if the upload failed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verified-release/provenance.json
            verified-release/SHA256SUMS
            verified-release/*-result.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
