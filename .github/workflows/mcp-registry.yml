name: MCP Registry

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Verify registry identity or publish reviewed public metadata
        required: true
        default: verify-identity
        type: choice
        options: [verify-identity, publish]
      reviewed_sha:
        description: Full main commit SHA accepted by independent QA
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: mcp-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified publisher v1.8.1
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Validate the public manifest without credentials
        run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'

  registry:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository_id == '1361592455' && github.repository == 'VirusTotal/virustotal-mcp'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the reviewed commit and its successful main CI
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          REGISTRY_OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          sha = os.environ['REVIEWED_SHA']
          if not re.fullmatch(r'[a-f0-9]{40}', sha) or sha != os.environ['GITHUB_SHA']:
              raise SystemExit('Dispatch must target the exact reviewed main commit')
          operation = os.environ['REGISTRY_OPERATION']
          if operation not in {'verify-identity', 'publish'}:
              raise SystemExit('Unsupported registry operation')
          result = subprocess.run(
              ['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}"],
              capture_output=True, check=True,
          )
          repository = json.loads(result.stdout)
          if repository['id'] != 1361592455:
              raise SystemExit('Unexpected repository identity')
          if operation == 'publish' and repository['private']:
              raise SystemExit('Registry publication requires the repository to be public')
          endpoint = (
              f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/ci.yml/runs"
              f'?head_sha={sha}&event=push&branch=main&per_page=10'
          )
          result = subprocess.run(['gh', 'api', endpoint], capture_output=True, check=True)
          runs = json.loads(result.stdout)['workflow_runs']
          if not any(run['head_sha'] == sha and run['head_branch'] == 'main'
                     and run['event'] == 'push' and run['status'] == 'completed'
                     and run['conclusion'] == 'success' for run in runs):
              raise SystemExit('This commit needs a successful main CI run before publication')
          PY
      - name: Install verified publisher v1.8.1
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Verify corporate registry identity and run the selected operation
        env:
          REGISTRY_OPERATION: ${{ inputs.operation }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import stat
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          operation = os.environ['REGISTRY_OPERATION']
          if operation not in {'verify-identity', 'publish'}:
              raise SystemExit('Unsupported registry operation')
          if operation == 'publish':
              manifest = json.loads(Path('server.json').read_text())
              if manifest['name'] != 'io.github.VirusTotal/virustotal-mcp':
                  raise SystemExit('Unexpected registry server identity')
              name = urllib.parse.quote(manifest['name'], safe='')
              version = urllib.parse.quote(manifest['version'], safe='')
              url = f'https://registry.modelcontextprotocol.io/v0.1/servers/{name}/versions/{version}'
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      existing = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise SystemExit('Registry preflight failed; no publication attempted') from None
              else:
                  if existing['server'] != manifest:
                      raise SystemExit('This version exists with different metadata; use a new version')
                  print('Identical version already published; no new publication attempted')
                  raise SystemExit(0)

          publisher = str(Path(os.environ['RUNNER_TEMP']) / 'mcp-publisher')
          credential = Path.home() / '.config/mcp-publisher/token.json'
          if credential.exists() or credential.is_symlink():
              raise SystemExit('Runner already has publisher credentials; refusing to replace them')
          try:
              result = subprocess.run(
                  [publisher, 'login', 'github-oidc'], capture_output=True, timeout=90,
              )
              if result.returncode:
                  raise SystemExit('Registry OIDC authentication failed')

              # Inspect only this job's newly issued credential. The trusted HTTPS
              # exchange authenticates it; decoding is not a local signature check.
              try:
                  descriptor = os.open(credential, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  try:
                      metadata = os.fstat(descriptor)
                      if (not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != os.getuid()
                              or stat.S_IMODE(metadata.st_mode) != 0o600
                              or metadata.st_size > 16384):
                          raise ValueError('Unexpected credential file')
                      raw = os.read(descriptor, 16385)
                  finally:
                      os.close(descriptor)
                  if len(raw) > 16384:
                      raise ValueError('Oversized credential')
                  saved = json.loads(raw)
                  if (saved['method'] != 'github-oidc'
                          or saved['registry'] != 'https://registry.modelcontextprotocol.io'):
                      raise ValueError('Unexpected credential source')
                  parts = saved['token'].split('.')
                  if len(parts) != 3 or not all(re.fullmatch(r'[A-Za-z0-9_-]+', p) for p in parts):
                      raise ValueError('Invalid token encoding')

                  def decode(part):
                      return json.loads(base64.b64decode(
                          part + '=' * (-len(part) % 4), altchars=b'-_', validate=True,
                      ))

                  header, claims = decode(parts[0]), decode(parts[1])
                  now = time.time()
                  if (header['alg'] != 'EdDSA' or claims['iss'] != 'mcp-registry'
                          or claims['auth_method'] != 'github-oidc'
                          or not isinstance(claims['auth_method_sub'], str)
                          or not claims['auth_method_sub']
                          or claims['permissions'] != [
                              {'action': 'publish', 'resource': 'io.github.VirusTotal/*'}
                          ]
                          or not all(type(claims[k]) is int for k in ['iat', 'nbf', 'exp'])
                          or not now - 300 <= claims['iat'] <= now + 60
                          or claims['nbf'] > now + 60 or claims['exp'] <= now):
                      raise ValueError('Unexpected registry identity or validity')
              except (KeyError, TypeError, ValueError, AttributeError, OSError):
                  raise SystemExit('Registry OIDC credential verification failed') from None
              print('Registry OIDC namespace confirmed: io.github.VirusTotal/*')

              if operation == 'publish':
                  result = subprocess.run(
                      [publisher, 'publish', 'server.json'], capture_output=True, timeout=90,
                  )
                  if result.returncode:
                      raise SystemExit('Registry publication failed; inspect the public entry before retrying')
                  print('Registry publication succeeded')
          finally:
              # CLI errors may contain raw response bodies; never print their output.
              # logout does not report removal failures, so verify local cleanup too.
              try:
                  subprocess.run([publisher, 'logout'], capture_output=True, timeout=10)
              except (OSError, subprocess.TimeoutExpired):
                  pass
              finally:
                  try:
                      credential.unlink(missing_ok=True)
                  except OSError:
                      raise SystemExit('Publisher credential cleanup failed') from None
                  if credential.exists():
                      raise SystemExit('Publisher credential cleanup failed')
          PY
      - name: Verify the published version through the anonymous API
        if: inputs.operation == 'publish'
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          manifest = json.loads(Path('server.json').read_text())
          name = urllib.parse.quote(manifest['name'], safe='')
          version = urllib.parse.quote(manifest['version'], safe='')
          url = f'https://registry.modelcontextprotocol.io/v0.1/servers/{name}/versions/{version}'
          with urllib.request.urlopen(url, timeout=30) as response:
              published = json.load(response)
          if published['server'] != manifest:
              raise SystemExit('Published metadata differs from the reviewed manifest')
          registry = published['_meta']['io.modelcontextprotocol.registry/official']
          if registry['status'] != 'active':
              raise SystemExit('The published version is not active')
          print(f'Verified active registry entry: {url}')
          PY
